<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 220px; margin: 12px; }
  label { display: block; margin-bottom: 10px; }
  input[type=range] { width: 100%; }
  .buttons { display: flex; gap: 6px; }
  button { flex: 1; }
</style>
<label>Gamma (Schatten): <output id="go">1.00</output>
  <input id="g" type="range" min="0.3" max="4" step="0.05" value="1">
</label>
<label>Helligkeit: <output id="bo">100</output>%
  <input id="b" type="range" min="0" max="300" value="100">
</label>
<label>Kontrast: <output id="co">100</output>%
  <input id="c" type="range" min="0" max="300" value="100">
</label>
<div class="buttons">
  <button id="reset">Zurücksetzen</button>
  <button id="magic">Magic</button>
</div>
<script src="popup.js"></script>
