<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="apple">
      <path id="body" d="M64 42 C52 31 22 31 18 60 C14 88 36 120 52 118 C58 117 60 113 64 113 C68 113 70 117 76 118 C92 120 114 88 110 60 C106 31 76 31 64 42 Z"/>
    </clipPath>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#ffc93c"/>
    </linearGradient>
  </defs>
  <!-- stem + leaf -->
  <path d="M64 42 C63 32 66 22 73 15" fill="none" stroke="#5a3a22" stroke-width="6" stroke-linecap="round"/>
  <path d="M70 30 C74 14 92 9 100 11 C96 27 80 35 70 30 Z" fill="#3cb04a" stroke="#1d1d24" stroke-width="3" stroke-linejoin="round"/>
  <!-- apple split diagonally: dark top-left, bright bottom-right -->
  <g clip-path="url(#apple)">
    <rect width="128" height="128" fill="url(#light)"/>
    <polygon points="0,0 120,0 8,128 0,128" fill="#1d1d24"/>
  </g>
  <use href="#body" fill="none" stroke="#1d1d24" stroke-width="5" stroke-linejoin="round"/>
  <!-- highlight on bright half -->
  <path d="M92 70 C96 82 92 96 84 104" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
</svg>
